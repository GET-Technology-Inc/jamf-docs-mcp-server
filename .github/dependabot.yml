version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    # Pinned to the day it has been running on, a little ahead of its usual
    # 01:22 UTC start. All five weekly npm runs from 2026-08-26 to 2026-09-23
    # started on a Wednesday at 01:22-01:23 UTC, but "weekly" is documented
    # to default to Monday, at a time Dependabot picks at random, so nothing
    # held it there. Pinned, the batch lands at a known time. In those runs
    # its auto-merged patch and minor PRs were all merged by 01:28 UTC,
    # within six minutes of the start, so anything scheduled after that, a
    # release included, sees the whole batch that same day.
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "01:00"
    # 5 is the documented default; it was 10. It caps how many PRs, and so
    # how many rounds of checks, the open backlog can reach. The most
    # version-update PRs open at once in the window was 6 (2026-09-02: #230
    # plus five from that morning's run); under the groups below the same
    # updates make 3. Security PRs are not counted against it and are never
    # held back by it.
    open-pull-requests-limit: 5
    # `deps` for every bump, and on purpose there is no `prefix-development`.
    # .releaserc.json releases `deps` as a patch, and "devDependency" does
    # not mean "not shipped" here: @modelcontextprotocol/ext-apps and
    # @modelcontextprotocol/client (with the @modelcontextprotocol/core they
    # pull in) are devDependencies that esbuild inlines into
    # src/core/apps/generated/app-html.ts, which is in the published package,
    # and esbuild, the tool that writes that file, is one too. A dev prefix
    # of a type that does not release (`chore`, say) would let such a bump
    # merge with every check green and publish nothing until some unrelated
    # change happened to cut a release. test/unit/dependabot-config.test.ts
    # holds this.
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    # Four groups, and their order matters: a dependency that matches more
    # than one goes to the first it matches.
    #
    # The first two hold packages that cannot land one at a time. Ungrouped,
    # Dependabot opens one PR per package. For those sets, the PRs keep going
    # red and can only land by hand: every weekly run from 2026-09-02 to
    # 2026-09-23 opened at least one (the PRs are listed under each group).
    # `update-types` is unset on both on purpose. The default takes every
    # SemVer level, and majors are exactly where a split breaks. A group PR
    # carrying a major still gets `major-update` and no auto-approval:
    # dependabot/fetch-metadata reports the highest update type in the PR.
    #
    # The last two only cut volume. Every Dependabot PR is its own round of
    # PR checks and its own run on main when it merges, and each of the five
    # weekly runs in the window took the organization to exactly 20
    # concurrent jobs, the GitHub Free limit, between 01:23 and 01:27 UTC.
    # Grouped this way, 9 of the 31 npm PRs in the 30 days to 2026-09-24
    # would have folded into another PR from the same run: 7 devDependency
    # bumps and 2 security fixes.
    groups:
      # @vitest/coverage-v8 pins vitest as an exact peer (4.1.11 wants vitest
      # "4.1.11", 5.0.1 wants "5.0.1"), so a PR moving one without the other
      # fails `npm ci` with ERESOLVE before a single test runs. The 5.x major
      # has arrived split that way twice, #272/#274 and then #298/#300, and all
      # four failed.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Two reasons, measured on 2026-09-24.
      #
      # 1. Bundle drift. esbuild inlines zod and @modelcontextprotocol/ext-apps
      #    into the committed src/core/apps/generated/app-html.ts, so any bump
      #    to either fails CI's "App UI bundle is up to date" step until the
      #    file is regenerated. #236 (zod 4.5.4) merged only after a hand-pushed
      #    regeneration, and #301 (zod) and #291 (ext-apps 2.0.0) fail there
      #    now. From ext-apps 2.0.0 on, @modelcontextprotocol/client and
      #    @modelcontextprotocol/core are inlined too.
      #
      # 2. An exact pin. client 2.1.0 and server 2.1.0 each depend on
      #    @modelcontextprotocol/core "2.1.0", not "^2.1.0", so moving one
      #    without the other nests a second copy of core. On a copy with
      #    ext-apps 2.0.0, a client-only bump inlined core 2.0.0 and 2.1.0 both;
      #    client and server together deduped to one 2.1.0. server is not in the
      #    bundle, but split from client it leaves the server under test and
      #    the client the tests drive on different cores.
      #
      # Grouped, that is one regeneration a week instead of one per package.
      #
      # The regeneration is still manual. Treat every PR from this group as
      # needing it:
      #
      #   npm run build:app-ui
      #   git add src/core/apps/generated/app-html.ts && git commit
      #
      # Pushing that commit dismisses the bot's approval (the main ruleset sets
      # dismiss_stale_reviews_on_push), and dependabot-auto-merge.yml will not
      # approve again because it only runs when the actor is dependabot[bot].
      # A maintainer has to approve or merge these PRs.
      app-ui-bundle:
        patterns:
          - "@modelcontextprotocol/*"
          - "zod"
          # esbuild writes app-html.ts, so a bump that changes what it emits
          # needs the same regeneration. Left to dev-dependencies below, it
          # would hold that week's PR, and every other dev bump in it, until
          # a maintainer regenerated and approved it by hand.
          - "esbuild"
      # Every other devDependency minor and patch bump, one PR a week. It was
      # one PR per package: 13 in the 30 days to 2026-09-24, which would have
      # been 6. A major outside the two groups above keeps a PR of its own,
      # which dependabot-auto-merge.yml never approves.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # Security fixes, one PR per batch. They arrive off the schedule and
      # together: #255/#256 on 2026-09-02 and #277/#278 on 2026-09-09, each
      # pair opened seconds apart. The groups above cannot take them:
      # `applies-to` defaults to version-updates.
      #
      # The bundle packages stay out, and keep arriving as a security PR
      # each. Any of them needs the regeneration app-ui-bundle describes, and
      # the push that carries it dismisses the bot's approval; in here, that
      # would hold every unrelated security fix, a runtime one included, in a
      # PR that waits for a maintainer.
      #
      # A fix that needs a major version would still hold the batch, and that
      # is accepted. It puts `major-update` on the whole PR (fetch-metadata
      # reports the highest type, as above), so dependabot-auto-merge.yml
      # approves none of it until a maintainer does. `update-types: ["minor",
      # "patch"]` would take out more than that fix. dependabot-core checks
      # that rule against the package's newest release, not the fixed version
      # (semver_rules_allow_grouping? in group_update_creation.rb, read
      # 2026-09-25), so it would have split both pairs above: #255 kept
      # fast-uri on 3.x with 4.0.0 out since 2026-06-09, and #277 kept js-yaml
      # on 4.x with 5.0.0 out since 2026-06-20. All four fixes in the window
      # were patches.
      security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns: ["zod", "@modelcontextprotocol/*", "esbuild"]
    ignore:
      # Held at 9.x deliberately. The 10.x line switched to
      # @conventional-changelog/template and requires
      # conventional-changelog-writer@9, but semantic-release 25 pins
      # release-notes-generator to writer ^8 — so 10.x fails the release with
      # `Missing helper: ... requires conventional-changelog-writer@9 or
      # newer`. #230 bumped it and broke every release after it.
      #
      # Separately — and this is the part that makes unpinning dangerous rather
      # than merely blocked — preset 10.x drops the `hidden: true` flags this
      # repo sets in `presetConfig.types`. It renamed the mechanism: constants.js
      # carries `effect: 'bump' | 'hidden'` and writer.js filters with
      # `isTypeEffect(entry, 'hidden')`. Nothing reads a `hidden` boolean, so the
      # four entries here are silently ignored and `chore`, `docs`, `ci` and
      # `test` land in an unlabelled block above Features.
      #
      # That is in the PRESET, not in semantic-release, so it does not go away
      # when 26 ships. Removing this ignore requires BOTH:
      #
      #   1. a stable @semantic-release/release-notes-generator that depends on
      #      conventional-changelog-writer@^9 (14.x pins ^8, so today there is
      #      none), and
      #   2. rewriting the four `hidden: true` entries in .releaserc.json to
      #      `effect: "hidden"`.
      #
      # Both verified by generating notes against this repo's own presetConfig:
      # preset 10 + `hidden: true` leaks the four types, preset 10 +
      # `effect: "hidden"` is correct.
      #
      # Check the generated notes before merging any change here. This failure
      # publishes; it does not fail CI.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10"]

      # Held on the line package.json `engines` names as its floor (>=24).
      # @types/node describes one Node release line, and checking src/
      # against a newer line than the oldest one this package supports lets
      # code call an API that line does not have. tsc passes, and CI's 24.x
      # leg catches it only if a unit test happens to reach the call; a
      # consumer on 24 gets a TypeError.
      #
      # Measured 2026-09-24: `process.addUncaughtExceptionCaptureCallback`
      # (added in Node 25.9.0) type-checks under @types/node 26.6.2, fails
      # under 24.13.6 with TS2551, and on Node 24.21.0 throws
      # `TypeError: process.addUncaughtExceptionCaptureCallback is not a
      # function`. Until 6.0.0 the types were ahead of `engines` the whole
      # time: ^25 against >=20 from the initial release (0b6e637), then ^26
      # from #145.
      #
      # Raise this together with `engines`, never on its own. Minor and patch
      # updates inside 24.x still arrive as usual.
      - dependency-name: "@types/node"
        versions: [">=25"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
