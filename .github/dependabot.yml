version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # Held at 9.x deliberately. The 10.x line switched to
      # @conventional-changelog/template and requires
      # conventional-changelog-writer@9, but semantic-release 25 pins
      # release-notes-generator to writer ^8 — so 10.x fails the release with
      # `Missing helper: ... requires conventional-changelog-writer@9 or
      # newer`. #230 bumped it and broke every release after it.
      #
      # Separately — and this is the part that makes unpinning dangerous rather
      # than merely blocked — preset 10.x drops the `hidden: true` flags this
      # repo sets in `presetConfig.types`. It renamed the mechanism: constants.js
      # carries `effect: 'bump' | 'hidden'` and writer.js filters with
      # `isTypeEffect(entry, 'hidden')`. Nothing reads a `hidden` boolean, so the
      # four entries here are silently ignored and `chore`, `docs`, `ci` and
      # `test` land in an unlabelled block above Features.
      #
      # That is in the PRESET, not in semantic-release, so it does not go away
      # when 26 ships. Removing this ignore requires BOTH:
      #
      #   1. a stable @semantic-release/release-notes-generator that depends on
      #      conventional-changelog-writer@^9 (14.x pins ^8, so today there is
      #      none), and
      #   2. rewriting the four `hidden: true` entries in .releaserc.json to
      #      `effect: "hidden"`.
      #
      # Both verified by generating notes against this repo's own presetConfig:
      # preset 10 + `hidden: true` leaks the four types, preset 10 +
      # `effect: "hidden"` is correct.
      #
      # Check the generated notes before merging any change here. This failure
      # publishes; it does not fail CI.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
