name: PR Title

# This repository squash-merges, and a squash keeps only the PR title: every
# typed commit message inside the PR is thrown away, so the title alone decides
# what semantic-release does with the merge.
#
# On 2026-09-21 that lost a release outright. PR #296 carried sixteen commits
# including a `feat`, was squashed under a title starting `chore:`, and
# commit-analyzer reported "Analysis of 1 commits complete: no release".
# Nothing was published, and because `chore` is `hidden: true` in the changelog
# preset the changes would not have surfaced in any later release notes either.
# Every check was green the whole time.
#
# Deliberately its own workflow rather than a job in ci.yml: this needs to
# re-run when the title is *edited*, and putting `edited` on ci.yml's trigger
# would rebuild the whole two-leg matrix every time someone fixes a typo.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Title releases what the PR contains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # No paths filter and no `needs`. The check is seconds long, and gating it
      # would reintroduce exactly the shape it guards against — a rule that
      # skips itself on the change it is meant to catch.
      - name: Check PR title against its commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commit messages are passed as JSON, not a delimited stream: they
          # are arbitrary multi-line text, and an earlier version of this file
          # tried to NUL-separate them and ended up embedding a real NUL byte
          # in the YAML. GitHub reported only "workflow file issue".
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --paginate --jq '[.[].commit.message]' \
            | node scripts/check-pr-title.mjs "$PR_TITLE"
