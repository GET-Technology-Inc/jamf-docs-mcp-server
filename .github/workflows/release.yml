name: Release

on:
  push:
    branches: [main]
  # Re-run a release that failed for a reason outside the repository — an npm
  # outage, an expired token, a registry timeout — without having to land
  # another commit just to trigger one.
  #
  # This does NOT force a version. semantic-release derives the release from
  # the commit messages since the last tag, so a manual run over commits that
  # earned nothing reports "no release" and exits successfully, exactly as an
  # automatic run would. To release work whose commits were flattened into a
  # non-releasable message, land a correctly typed commit — pr-title.yml exists
  # to stop that happening in the first place.
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
