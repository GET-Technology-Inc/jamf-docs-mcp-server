name: Release

on:
  push:
    branches: [main]
  # Re-run a release that failed for a reason outside the repository — an npm
  # outage, an expired token, a registry timeout — without having to land
  # another commit just to trigger one.
  #
  # This does NOT force a version. semantic-release derives the release from
  # the commit messages since the last tag, so a manual run over commits that
  # earned nothing reports "no release" and exits successfully, exactly as an
  # automatic run would. To release work whose commits were flattened into a
  # non-releasable message, land a correctly typed commit — pr-title.yml exists
  # to stop that happening in the first place.
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # '24.x', not an exact 24 release: the release plugins need a recent
      # one. @semantic-release/changelog 7.0.0 and git 11.0.1 declare
      # `^22.22.2 || >=24.15`, and semantic-release 25.0.9, npm 13.1.5 and
      # github 12.0.6 `^22.14.0 || >= 24.10.0`. setup-node takes the runner
      # image's cached 24 when it has one, so this trails the newest 24 by an
      # image update: on 2026-09-24 jobs of one CI run for PR #311 got
      # 24.20.0 and 24.21.0.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
