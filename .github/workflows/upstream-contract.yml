name: Upstream Contract Check

# Detects when a Jamf documentation source drifts from the shape our code depends
# on. One suite per upstream: `data-contracts` covers the learn.jamf.com Fluid
# Topics API (metadata fields, product labels, clustering, content format),
# `support-kb-contracts` the support.jamf.com Intercom Help Center — above all
# the block-type vocabulary the renderer dispatches on — and
# `concepts-contracts` the concepts.jamf.com sitemap and page structure. All
# three hit the REAL service; a failure on a schedule means upstream changed:
# the same class of change that silently broke non-Pro search and ingestion,
# and that dropped every table out of a support article.
#
# This runs OUT OF BAND (cron) and opens an issue on drift. It is deliberately NOT
# part of the merge gate — live-API flakiness must never block PRs.

on:
  schedule:
    - cron: '0 6 * * MON' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  contract:
    name: Live API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Retry to absorb transient network/rate-limit blips — a genuine contract
      # break fails all attempts, a flake usually passes on retry.
      #
      # Go through the npm script rather than calling vitest directly. The suite
      # only reaches upstream when ALLOW_LIVE_REQUESTS=1 is set, and package.json
      # is the single place recording which tiers may do that. `npx vitest run`
      # bypassed it: from 2026-09-03, when the global fetch guard in
      # test/helpers/no-network.setup.ts landed, the guard threw inside beforeAll
      # and every assertion was reported as skipped. That reads as a suite
      # failure, so this job opened upstream-drift issues for twelve days without
      # having contacted learn.jamf.com once — the exact silent-breakage class it
      # exists to detect, aimed at itself.
      #
      # `npm run test:integration -- <file>` is NOT an alternative: vitest unions
      # positional filters, so it would widen the job to the whole integration
      # tier instead of narrowing it to the contract suite.
      - name: Run live API contract tests
        id: contract
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run test:contract

      - name: Open issue on upstream drift
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Upstream contract drift detected (learn.jamf.com)';
            const body = [
              'The scheduled **Upstream Contract Check** failed, which means the live',
              'Jamf API (`learn.jamf.com`) no longer matches a shape our code depends on',
              '(a metadata field, product label, clustering axis, or content format).',
              '',
              'This is the same class of change that previously broke non-Pro search and',
              'ingestion. Investigate before it degrades production silently.',
              '',
              `- Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Start from the failing assertions: learn.jamf.com is covered by',
              '  `test/integration/data-contracts.test.ts`, support.jamf.com by',
              '  `test/integration/support-kb-contracts.test.ts`, and',
              '  concepts.jamf.com by `test/integration/concepts-contracts.test.ts`.',
              '- Remember the downstream consumers: `jamf-docs-mcp-worker` (ingestion) and',
              '  `jamf-docs-chatbot` (via RPC).',
            ].join('\n');

            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'upstream-drift', per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number,
                body: `Contract check failed again on ${new Date().toISOString().slice(0, 10)} — see run ${context.runId}.`,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['upstream-drift'] });
            }
