name: CI

# The merge gate, and Codecov's feed. Three jobs on every run, and a fourth on
# pull requests:
#
#   Test (Node 24.x)  type checks, lint, app-ui bundle freshness, build, the
#                     unit tier
#   Test (Node 26.x)  the unit tier with coverage, build, the app-ui bundle for
#                     analysis, then the advisory production audit and licence
#                     check
#   Codecov Upload    sends the 26.x leg's reports; the only job that can mint
#                     an OIDC token
#   Integration Test  live APIs; pull requests only, and never blocks a merge
#
# Before this layout, a run that changed code was seven jobs: Detect Changes
# (a paths filter), the two Test legs, Integration, Security Audit, Coverage
# and Codecov Upload; a run that changed none was Detect Changes and a no-op
# `test-gate` pair publishing the two Test names. GitHub bills every job
# rounded up to a whole minute
# (docs.github.com/en/billing/reference/actions-runner-pricing), and most of
# those jobs were a fraction of one. In the 30 days to 2026-09-24 Detect
# Changes averaged 6s over 195 jobs; Security Audit 16s over 190, 8s of it the
# checkout, setup-node and npm ci the Test legs had already done; and Coverage
# 37s over 190, running the unit tier a third time. Across the repository, 971
# jobs under 30s were billed 971 minutes for 190 minutes of work. On the step
# timings of this matrix, a run that tested code billed about 6.08 minutes
# before Integration; this layout bills about 3.08 for the same checks, with
# the unit tier run twice rather than three times, and npm ci three times on
# a PR rather than five. Most of the difference is rounding, not runner time.
#
# The work moved into the two legs because only their names can block a
# merge. The ruleset on main requires exactly two checks, "Test (Node 24.x)"
# and "Test (Node 26.x)", from GitHub Actions. A job of any other name is a
# check the ruleset does not know about, so a lint failure in it would block
# nothing; and a leg renamed or dropped leaves a required name unreported, so
# every PR waits for it forever. test/unit/ci-matrix.test.ts holds the legs'
# names to the ruleset's, and fails if any other job publishes one.
#
# No paths filter, at the trigger or in a step. At the trigger, a skipped
# workflow leaves both required checks "Pending" and no PR can merge. In a
# step it fails the other way, green: on a draft of this layout that filtered
# per step, one `if:` added to the filter step emptied its outputs, every step
# gated on them skipped, and both required checks passed with nothing tested,
# which is what dependabot-auto-merge.yml merges on. A filter would save
# little: in those 30 days 2 of 85 PRs changed nothing a filter would call
# code (#269, .github/dependabot.yml; #303, README.md and docs/README.zh-TW.md),
# about 4 billed minutes, and the unit tier reads both kinds of file anyway
# (workflow-files scans .github/; env-vars-documented and docs-product-tables
# read the READMEs). test/unit/ci-gating.test.ts fails if a filter comes back.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The two required checks. No job-level `if` and no `needs`, on purpose: a
  # matrix job that is skipped reports its name unexpanded, as
  # "Test (Node ${{ matrix.node-version }})", never as the names the ruleset
  # requires (the old test-gate pair did so whenever it was skipped, as on
  # PR #309's head and on #327's). Each step decides only which leg it runs
  # on.
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Restates the workflow's `contents: read`, so that the missing `id-token`
    # is visible here. This job runs npm ci (and with it the install scripts
    # of every dependency), the tests and esbuild; the Codecov Upload job
    # below is the one that can mint a token. test/unit/ci-oidc.test.ts fails
    # if this job is granted it.
    permissions:
      contents: read
    strategy:
      # Both legs run to the end. With fail-fast, the first leg to fail
      # cancels the other, and a cancelled 26.x leg runs neither its tests nor
      # the hand-off to Codecov Upload, which matters most on exactly those
      # runs. Of the 19 failed CI runs in the 30 days to 2026-09-24, on the
      # 20.x/22.x matrix of the time, 7 failed a check that is now pinned to
      # the 24.x leg: 6 the app-ui bundle check and 1 lint. Fail-fast
      # cancelled the other leg in 3 of them (runs 33655291381, 35043896601
      # and 35043916393). In 2 the other leg had already passed, and in 2 it
      # failed the same check, which then ran on both legs. In this layout
      # it could be any of them: the 24.x leg is through lint and the bundle
      # check about 33s in (median of the 49 24.x legs that passed them on
      # 2026-09-24), which is where the Coverage job was with its unit run
      # (33.5s median over 178), and the 26.x leg does its build, hand-off
      # and audit after that. 11 more were npm ci ERESOLVE, which fails both
      # legs anyway. The price is the rest of a leg on a failed run, at most
      # a billed minute. test/unit/ci-matrix.test.ts fails if this goes.
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The five steps below are decided by the tool versions npm ci pins, not by
      # the Node runtime, so running them on both matrix legs produces the same
      # answer twice. Pinned to one leg rather than hoisted into a job of their
      # own, because only the legs' names can block a merge (see the top of
      # this file).
      #
      # The leg is 24.x, the floor package.json `engines` publishes (>=24 since
      # 6.0.0; it was 22.x under >=20). A pin that names no leg of the matrix
      # does not fail, it skips: the step never runs and the job stays green.
      # test/unit/ci-matrix.test.ts fails instead.
      - name: Type check
        if: matrix.node-version == '24.x'
        run: npm run typecheck

      # app-ui/ has its own tsconfig (DOM lib, bundler resolution) and is not
      # covered by the root one. esbuild only strips types, so without this
      # step the bundle's sources are never type-checked at all.
      - name: Type check (app-ui)
        if: matrix.node-version == '24.x'
        run: npm run typecheck:app-ui

      # test/ is likewise outside the root tsconfig, which only includes src/**.
      # Without this step no test file is ever type-checked, and eslint's
      # type-aware rules have no project to consult for them either.
      - name: Type check (test)
        if: matrix.node-version == '24.x'
        run: npm run typecheck:test

      - name: Lint
        if: matrix.node-version == '24.x'
        run: npm run lint

      # src/core/apps/generated/app-html.ts is committed but generated. Rebuild
      # it and fail if the result differs, so the artifact can never drift from
      # app-ui/ + scripts/build-app-ui.mjs.
      #
      # This must stay ahead of the Build step below: `npm run build` runs
      # `build:app-ui` too, and would overwrite the evidence before it is read.
      - name: App UI bundle is up to date
        if: matrix.node-version == '24.x'
        run: |
          npm run build:app-ui
          git diff --exit-code -- src/core/apps/generated/app-html.ts

      # The unit tier on the 26.x leg, instrumented for coverage. It stands in
      # for the plain `Unit Test` step the 24.x leg runs below rather than
      # repeating it: test/unit/ci-matrix.test.ts fails if a leg runs the tier
      # twice or not at all. Until 2026-09 it was a Coverage job of its own.
      #
      # The runtime does not change the result. Coverage is decided by the
      # tool versions npm ci pins: on 2026-09-24 the unit tier reported
      # 91.41 / 81.69 / 90.17 / 92.78 (stmts / branch / fn / lines) on Node
      # 20.20, 22.23, 24.21 and 26.9 alike. It is here rather than on the floor
      # leg, which already carries the type checks, lint and the bundle check:
      # modelled on the step timings of the 48 runs of this matrix on
      # 2026-09-24, a leg would have run past a billed minute in 26 of them
      # with it on 24.x, and in 4 with it here.
      #
      # Ahead of Build, unlike the 24.x leg's Unit Test, for the reason the
      # Coverage job ran its app-ui build after its tests. `npm run build`
      # runs `build:app-ui`, which rewrites
      # src/core/apps/generated/app-html.ts, and the unit tier imports that
      # file (test/unit/apps/app-html.test.ts parses the script it inlines).
      # Here the tier reads the committed file, whatever the 24.x leg's
      # freshness check finds, and the 24.x Unit Test reads the rebuilt one;
      # the two are the same bytes whenever that check passes. It also runs
      # with no dist/, which nothing in test/unit reads (why the Coverage job
      # had no Build step), so a unit test that came to need build output
      # fails here instead of passing on the leg that built first.
      # test/unit/ci-matrix.test.ts fails if a build step moves ahead of it
      # on this leg.
      #
      # The JUnit report is for Codecov Test Analytics (the Codecov Upload
      # job sends it). Naming any reporter on the command line replaces
      # vitest's defaults rather than adding to them, and under GitHub Actions
      # those defaults are `default` plus `github-actions` (the failure
      # annotations), so both are named again to keep what the plain run
      # prints.
      - name: Run unit tests with coverage
        if: matrix.node-version == '26.x'
        run: >-
          npm run test:unit -- --coverage
          --reporter=default --reporter=github-actions
          --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Build
        run: npm run build

      - name: Unit Test
        if: matrix.node-version == '24.x'
        run: npm run test:unit

      # The MCP App UI script, for Codecov's bundle analysis as bundle `app-ui`.
      #
      # Built on this leg rather than taken from the 24.x leg, which already
      # builds app-ui for its freshness check, so that one artifact from one
      # leg carries everything the Codecov Upload job sends. The price is one
      # more esbuild run, about a second. A broken build fails this leg at
      # Build above; here it only costs the upload.
      #
      # Built on every run, including the ones whose Codecov Upload job will
      # not send it (no OIDC token: fork PRs, and possibly Dependabot's). This
      # leg has no token in either case, so it cannot tell them apart.
      - name: Build the app-ui bundle for analysis
        if: matrix.node-version == '26.x'
        continue-on-error: true
        env:
          APP_UI_BUNDLE_DIR: bundle-stats/app-ui
        run: npm run build:app-ui

      # The hand-off to the Codecov Upload job, from this leg only. A step runs
      # on both legs unless its `if` says otherwise, and two legs uploading one
      # artifact name would race, `overwrite` letting whichever finished last
      # win. test/unit/ci-oidc.test.ts holds it to one leg.
      #
      # `!cancelled()` because a run whose tests failed is the one Test
      # Analytics exists to report, and the default `success()` would skip
      # this step exactly then. Such a run hands over the JUnit report alone:
      # vitest deletes coverage/ instead of writing it when a test fails
      # (`coverage.reportOnFailure` is off by default; checked on vitest 5.0.1
      # on 2026-09-25), and the bundle build above does not run.
      #
      # `if-no-files-found: error` under `continue-on-error`, the way the
      # uploads use `fail_ci_if_error`: an empty hand-off shows as a failed
      # step, and never fails the job. It happens only when the leg failed
      # before its tests ran.
      #
      # Kept 3 days rather than the default 90. The Codecov Upload job reads
      # it a minute later, and 3 days leaves room to re-run that job on its
      # own after a Codecov outage. `overwrite` because a name is unique
      # within a run (upload-artifact v4 made artifacts immutable), and a
      # re-run of this leg uploads under the same one. A re-run that fails
      # before its tests uploads nothing and replaces nothing, so the Codecov
      # Upload job after it gets the earlier attempt's reports: the same
      # commit's, and after a failed leg it sends only their test results.
      - name: Hand the reports to the Codecov Upload job
        if: ${{ !cancelled() && matrix.node-version == '26.x' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: codecov-inputs
          path: |
            coverage/coverage-final.json
            test-results/junit.xml
            bundle-stats/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # The two steps below reach the npm registry at run time. The audit only
      # reads advisories and runs nothing; the licence check runs a tool npx
      # resolves on the spot. They come after the hand-off, so nothing they
      # bring in is on the runner while the unit run tests the tree, or while
      # the reports are written and the hand-off packs them.
      # test/unit/ci-oidc.test.ts fails if either moves ahead of it.
      #
      # That is what the order buys, and it is not a wall. The hand-off sets
      # `overwrite`, and the Codecov Upload job downloads only once this
      # whole leg has ended, so a later step holding the runner's artifact
      # token could still replace `codecov-inputs`. A run step is not handed
      # that token, but a process can read it out of the Runner.Worker
      # process's memory with the runner user's passwordless sudo, the way
      # the tj-actions/changed-files compromise read secrets. npm ci's
      # install scripts, ahead of the hand-off, could already do as much.
      # What holds either way is the Codecov Upload job treating the
      # artifact as data: unpacked under RUNNER_TEMP, and only the three
      # reports read from it, by full path.
      #
      # Both are advisory, as they were as a job and a workflow of their own
      # (neither was ever a required check), but a finding no longer turns
      # the run red: it shows as a failed step and an annotation on a green
      # leg. `!cancelled()` because on their own they ran whatever the tests
      # did, and a failed test should not hide a finding.
      #
      # Was the Security Audit job: 190 jobs in the 30 days to 2026-09-24, 16s
      # on average and each billed a minute. Production dependencies only:
      # that is the tree consumers install. An advisory published today should
      # not block every unrelated PR until a fixed version exists.
      - name: Security audit (production dependencies)
        if: ${{ !cancelled() && matrix.node-version == '26.x' }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Was license-check.yml: 76 runs in the 30 days to 2026-09-24, each with
      # an npm ci of its own and billed a minute for a check of 2s median. It
      # found no licence problem in that time; all 11 of its failures were npm
      # ci ERESOLVE, which the Test legs reported too. It ran only on PRs that
      # changed package.json or package-lock.json. Here it runs on every run,
      # since no step here decides from the changed files (see the top of this
      # file), and took 3s, npx's download included, on 2026-09-25.
      #
      # Pinned: `npx license-checker` ran whatever `latest` was on the day. The
      # pin fixes license-checker but not its ten dependencies, which are
      # ranges (chalk ^2.4.1, debug ^3.1.0, read-installed ~4.0.3, ...)
      # resolved afresh on every run: hence the place after the hand-off, and
      # `npm_config_ignore_scripts`, so that the resolve runs no install
      # script.
      - name: Dependency licences (production)
        if: ${{ !cancelled() && matrix.node-version == '26.x' }}
        continue-on-error: true
        env:
          npm_config_ignore_scripts: 'true'
        run: >-
          npx --yes license-checker@25.0.1 --production
          --failOn "GPL-2.0-only;GPL-3.0-only;AGPL-1.0-only;AGPL-3.0-only;SSPL-1.0"
          --summary

  integration:
    name: Integration Test
    # Pull requests only. On a push to main it re-ran, against live APIs, code
    # that had just passed it on the PR, and there it could block nothing: it
    # ran on 70 of the 73 pushes to main in the 30 days to 2026-09-24 (71
    # jobs, one push having been re-run) and failed on none. No `needs`: it
    # starts alongside the Test legs, so a lint failure on 24.x does not hide
    # what the live APIs say.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Integration tests hit real APIs — flaky due to rate limits.
    # Not a required status check; failures don't block merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `test:integration` deliberately EXCLUDES the three `*contracts.test.ts`
      # suites. They assert the shape of live Jamf endpoints, so they go red when
      # Jamf changes something — which is a fact about Jamf, not about this PR.
      # upstream-contract.yml runs them on a cron and opens an issue instead;
      # its header has always said they are "deliberately NOT part of the merge
      # gate", and until 2026-09-18 this directory glob quietly swept them back
      # in. `test/unit/ci-gating.test.ts` fails if that happens again.
      - name: Integration Test (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run test:integration

  # Sends the Test (Node 26.x) leg's reports to Codecov. This is the only job
  # with `id-token: write`, and it runs none of the project's code: no npm ci,
  # no tests, no build. It checks out the tree, downloads the artifact under
  # RUNNER_TEMP rather than into the checkout, and runs codecov-action and
  # the bundle analyzer, which is installed on its own at a pinned version.
  # test/unit/ci-oidc.test.ts holds it to that. That is why it stays a job of
  # its own, and a billed minute per run (17-18s in the runs after #327),
  # where the Audit and Coverage jobs folded into a Test leg.
  #
  # Codecov authenticates these uploads with a GitHub OIDC token, and
  # `id-token: write` is what lets a job request one. A job-level block
  # replaces the workflow-level one rather than adding to it, hence
  # `contents: read` again for actions/checkout.
  #
  # On 2026-09-25 the organization switched Codecov to require upload
  # authentication. The upload had been tokenless all along — there is no
  # CODECOV_TOKEN secret, so `token: ${{ secrets.CODECOV_TOKEN }}` sent an
  # empty string — and from then on Codecov refused it for main with
  # {"message":"Token required because branch is protected"}. OIDC needs no
  # long-lived secret to store, rotate or leak.
  #
  # Not a required check, and it cannot fail the run. Every step that talks
  # to Codecov is continue-on-error, and so is the job, for the few steps
  # that are not.
  codecov-upload:
    name: Codecov Upload
    needs: test
    # After Test legs that ran, whether their tests passed or failed; not
    # after a cancelled run, which has nothing to send. `test` has no
    # condition of its own, so it is never skipped. Without a status function
    # the implicit `success()` would skip this job exactly when a test failed.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      # Codecov's CLI sends the repository's file list (`git ls-files`) with
      # a coverage upload, for path fixing, so the tree has to be here.
      # Nothing in this job builds or runs it. The default depth-1 clone is
      # enough: codecov-action takes the PR head commit from the event
      # payload, not from history, and uploads had always gone from such a
      # clone before this job existed. `persist-credentials: false` keeps
      # GITHUB_TOKEN out of .git/config, where every later step could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Into RUNNER_TEMP, never the checkout. Anything that runs in the
      # Test (Node 26.x) leg can decide what this artifact holds: npm ci's
      # install scripts and the tests run there as the same user as the
      # upload-artifact step after them. download-artifact writes each zip
      # entry at its own path under the target and rewrites only `..` segments
      # (unzip-stream in download-artifact v8.0.1). Unpacked into the
      # checkout, an entry named .git/config would replace the checkout's own,
      # and every git command this job runs there would run whatever that
      # file's core.fsmonitor names, with the OIDC request variables in its
      # environment: Codecov's CLI runs `git ls-files`, the bundle analyzer
      # `git show`, and checkout's post step `git submodule foreach`
      # (core.fsmonitor checked with `git ls-files` on git 2.55.0, the
      # runner's version, on 2026-09-25). The CLI also reads settings of its
      # own from a codecov.yml at the checkout's root. Under RUNNER_TEMP the
      # entries stay inside codecov-inputs/, which holds nothing else, and the
      # steps below only read the three reports from it, by full path.
      #
      # With no artifact (the 26.x leg failed before its tests ran), this
      # step fails and the uploads below are skipped.
      - name: Download the Test (Node 26.x) leg's reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: codecov-inputs
          path: ${{ runner.temp }}/codecov-inputs

      # A run gets an OIDC token only if the runner can issue one, and on a
      # fork PR it cannot. Dependabot's PRs run "as if they were opened from a
      # repository fork" (GitHub's Dependabot docs), so they may not either.
      # Asking codecov-action for OIDC without a token fails the step before
      # anything is uploaded ("Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env
      # variable", measured on #326). So this step asks the runner instead of
      # guessing from the actor: OIDC when ACTIONS_ID_TOKEN_REQUEST_URL is set,
      # and otherwise a tokenless coverage upload under the PR's head label.
      #
      # Codecov takes a tokenless upload only for a branch name with a colon
      # in it, an "unprotected branch" in docs.codecov.com/docs/codecov-tokens,
      # which is why codecov-action sends `owner:branch` for fork PRs. The
      # PR's own branch name does not qualify. Measured on #326 with the token
      # withheld (run 36033319084): under `ci/codecov-features` the coverage
      # upload was refused with {"message":"Token required because branch is
      # protected"}; under `GET-Technology-Inc:ci/codecov-features` it was
      # accepted and processed.
      - name: Pick Codecov upload auth
        id: codecov-auth
        env:
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "oidc=true" >> "$GITHUB_OUTPUT"
          else
            echo "oidc=false" >> "$GITHUB_OUTPUT"
            echo "branch=${HEAD_LABEL}" >> "$GITHUB_OUTPUT"
            echo "::notice title=Codecov::No OIDC token in this run: coverage uploads tokenless as '${HEAD_LABEL}'."
          fi

      # Never fails the job, and never fails quietly either.
      #
      # `fail_ci_if_error: false` alone hid every refusal: on 2026-09-24 the
      # upload for main at 053bbcd was refused with {"message":"Token required
      # - not valid tokenless upload"} and the job still reported success
      # (run 36003579775, attempt 1). Nor does that input reach the OIDC
      # request, which codecov-action makes in a github-script step of its
      # own and which fails the action outright when it cannot get a token.
      # So the action fails its step on any error, and `continue-on-error`
      # keeps that from failing the job: a refused upload shows as a failed
      # step and an annotation on a green run.
      #
      # Only after both legs passed. `needs.test.result` is the matrix's one
      # result: `success` when every leg succeeded, `failure` when any leg
      # failed. So a run whose 24.x leg failed sends no coverage, even when
      # the 26.x leg passed and wrote a report; that commit fails a required
      # check anyway, and its test results still go. (When the 26.x leg's own
      # tests fail, there is no report to send: see the hand-off step.)
      #
      # The file is named and the search is off, so Codecov gets exactly the
      # report the 26.x leg wrote (the search used to find that one file
      # anyway). `plugins: noop` turns off the CLI's default xcode, gcov and
      # pycoverage plugins, which look for report files of their own and run
      # tools on them. This project has none, and this job should run nothing
      # on files the 26.x leg could have put there.
      - name: Upload coverage to Codecov
        if: steps.reports.outcome == 'success' && needs.test.result == 'success'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ${{ runner.temp }}/codecov-inputs/coverage/coverage-final.json
          disable_search: true
          plugins: noop
          use_oidc: ${{ steps.codecov-auth.outputs.oidc }}
          override_branch: ${{ steps.codecov-auth.outputs.branch }}
          fail_ci_if_error: true

      # Test Analytics: failed tests on the PR comment, flaky tests on main.
      # codecov-action@v7 uploads it itself with `report_type: test_results`
      # (codecov/test-results-action is archived). It runs after failed tests
      # too, which is the point: the job's `!cancelled()` lets it start then.
      #
      # OIDC only. Tokenless, Codecov takes the upload and keeps nothing: on
      # #326 with the token withheld (run 36033319084) the upload under the
      # head label ended "Upload queued for processing complete", and no test
      # result ever appeared for that commit. Codecov's test-results endpoint
      # refuses a tokenless upload whose branch differs from the one recorded
      # for the commit, and once it has processed the coverage upload it
      # records a same-repo PR's commit under the plain branch name
      # (TestAnalyticsTokenlessAuthentication and
      # update_commit_from_provider_info in codecov/umbrella).
      - name: Upload test results to Codecov
        if: steps.reports.outcome == 'success' && steps.codecov-auth.outputs.oidc == 'true'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ${{ runner.temp }}/codecov-inputs/test-results/junit.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      # For the bundle analyzer below, and nothing else. No `cache: 'npm'`,
      # unlike every other job here: that cache is saved by the jobs that run
      # npm ci, and this job must not take in what they leave behind.
      # `package-manager-cache: false` keeps setup-node from turning it on by
      # itself should package.json ever name a packageManager.
      - name: Setup Node.js
        if: steps.reports.outcome == 'success' && needs.test.result == 'success' && steps.codecov-auth.outputs.oidc == 'true'
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false

      # Bundle analysis of the app-ui script the 26.x leg built.
      #
      # Codecov has no esbuild plugin (@codecov/esbuild-plugin is a 404 on
      # npm), so @codecov/bundle-analyzer measures the file on disk. Its OIDC
      # switch is a config-file key (`oidc.useGitHubOIDC`), not a flag.
      #
      # It is installed here on its own, not from package.json, where it is
      # no longer listed: npm ci would install the project's whole dependency
      # tree, install scripts and all, into the one job that can mint a token.
      # `--prefix` puts it under RUNNER_TEMP, and npm then reads its project
      # config there, so the checkout's package.json, lockfile and any .npmrc
      # play no part. (Checked on 2026-09-25 with an .npmrc in the working
      # directory pointing the registry at a closed port: the install still
      # went to registry.npmjs.org.) `--ignore-scripts` although none of its
      # 58 packages has an install script today.
      #
      # The exact version pins the analyzer but not its dependencies, which
      # are ranges (yargs ^17.7.2, micromatch ^4.0.8, and @actions/core and
      # the @octokit packages through @codecov/bundler-plugin-core): a fresh
      # resolve takes whatever matches on the day. `--before` fixes them at
      # the versions published by that date, so nothing published later can
      # reach this job. To upgrade, move both together. A version newer than
      # the date fails the install with ETARGET; it cannot float.
      #
      # OIDC only, like the test results and for the same reason: on #326 with
      # the token withheld (run 36033319084), the analyzer got its upload URL
      # and reported "Successfully uploaded stats for bundle: app-ui" under the
      # head label, and Codecov never showed a bundle report for that commit.
      # Its bundle endpoint makes the same branch check
      # (BundleAnalysisTokenlessAuthentication in codecov/umbrella).
      - name: Upload app-ui bundle stats to Codecov
        if: steps.reports.outcome == 'success' && needs.test.result == 'success' && steps.codecov-auth.outputs.oidc == 'true'
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/codecov-bundle-analyzer" \
            --no-save --ignore-scripts --no-audit --no-fund \
            --before=2026-09-24T00:00:00Z @codecov/bundle-analyzer@2.0.1
          echo '{"oidc":{"useGitHubOIDC":true}}' > "$RUNNER_TEMP/bundle-analyzer.json"
          "$RUNNER_TEMP/codecov-bundle-analyzer/node_modules/.bin/bundle-analyzer" \
            "$RUNNER_TEMP/codecov-inputs/bundle-stats/app-ui" --bundle-name=app-ui \
            --config-file="$RUNNER_TEMP/bundle-analyzer.json"
