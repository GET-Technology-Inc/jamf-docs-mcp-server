name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              # app-ui/ and scripts/ produce src/core/apps/generated/app-html.ts,
              # which ships in dist/. A change to either is a change to the
              # published artifact and must run the same gate.
              - 'app-ui/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'eslint.config.*'
              # test/unit/ci-gating.test.ts reads these two files off disk and
              # asserts on their text — above all that ci.yml does NOT run the
              # contract suites. Without them here, a PR that edits only a
              # workflow takes the test-gate no-op path below and that guard
              # never runs: the same silent-failure shape it was written for.
              # Deliberately narrow — '.github/workflows/**' would drag the full
              # matrix plus integration, audit and coverage into a stale.yml
              # typo fix for no added protection.
              - '.github/workflows/ci.yml'
              - '.github/workflows/upstream-contract.yml'

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The five steps below are decided by the tool versions npm ci pins, not by
      # the Node runtime, so running them on both matrix legs produces the same
      # answer twice. Pinned to 22.x rather than hoisted into a job of their own:
      # branch protection requires a check named "Test (Node <version>)" — which
      # is the only reason the test-gate no-op below exists — and a new job would
      # publish a name it does not know about.
      - name: Type check
        if: matrix.node-version == '22.x'
        run: npm run typecheck

      # app-ui/ has its own tsconfig (DOM lib, bundler resolution) and is not
      # covered by the root one. esbuild only strips types, so without this
      # step the bundle's sources are never type-checked at all.
      - name: Type check (app-ui)
        if: matrix.node-version == '22.x'
        run: npm run typecheck:app-ui

      # test/ is likewise outside the root tsconfig, which only includes src/**.
      # Without this step no test file is ever type-checked, and eslint's
      # type-aware rules have no project to consult for them either.
      - name: Type check (test)
        if: matrix.node-version == '22.x'
        run: npm run typecheck:test

      - name: Lint
        if: matrix.node-version == '22.x'
        run: npm run lint

      # src/core/apps/generated/app-html.ts is committed but generated. Rebuild
      # it and fail if the result differs, so the artifact can never drift from
      # app-ui/ + scripts/build-app-ui.mjs.
      #
      # This must stay ahead of the Build step below: `npm run build` runs
      # `build:app-ui` too, and would overwrite the evidence before it is read.
      - name: App UI bundle is up to date
        if: matrix.node-version == '22.x'
        run: |
          npm run build:app-ui
          git diff --exit-code -- src/core/apps/generated/app-html.ts

      - name: Build
        run: npm run build

      - name: Unit Test
        run: npm run test:unit

  integration:
    name: Integration Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Integration tests hit real APIs — flaky due to rate limits.
    # Not a required status check; failures don't block merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `test:integration` deliberately EXCLUDES the three `*contracts.test.ts`
      # suites. They assert the shape of live Jamf endpoints, so they go red when
      # Jamf changes something — which is a fact about Jamf, not about this PR.
      # upstream-contract.yml runs them on a cron and opens an issue instead;
      # its header has always said they are "deliberately NOT part of the merge
      # gate", and until 2026-09-18 this directory glob quietly swept them back
      # in. `test/unit/ci-gating.test.ts` fails if that happens again.
      - name: Integration Test (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run test:integration

  # Required status check — reports success when test is skipped
  test-gate:
    name: Test (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - run: echo "Skipped — no code changes"

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 22.x because vitest 5 does not support Node 20. vitest 5.0.1 declares
      # engines `^22.12.0 || ^24.0.0 || >=26.0.0`, and the
      # @vitest/istanbul-lib-* packages that @vitest/coverage-v8 5 reports
      # through declare `>=22`. This job had run on 20.x since the initial
      # release (0b6e637) with no recorded reason.
      #
      # Moving it changes nothing about the result. Coverage is decided by the
      # tool versions npm ci pins, not by the runtime: on 2026-09-24 the unit
      # tier reported 91.41 / 81.69 / 90.17 / 92.78 (stmts / branch / fn /
      # lines) on Node 20.20, 22.23 and 26.9 alike. It did still run on 20
      # then, but only because npm treats `engines` as a warning, and nothing
      # promises the next vitest patch keeps working there.
      #
      # The Test matrix's 20.x leg is a different question — which Node
      # versions this package supports at runtime (package.json `engines`) —
      # and is not decided by this job.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No Build step: the coverage job runs only `test:unit`, and nothing in
      # test/unit reads dist/. `requireFreshBuild` is called by exactly two
      # suites (test/integration/mcp-server, test/e2e/http-transport), neither
      # of which runs here, and the one generated file the unit tier touches —
      # src/core/apps/generated/app-html.ts — is committed.
      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
